<div class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="{% url 'home' %}">VideoShare</a>

    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarNav"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link" href="{% url 'home' %}">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'content:video_list' %}">Videos</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'content:short_videos' %}">Shorts</a>
        </li>
      </ul>

      <div class="d-flex">
        {% if user.is_authenticated %}
        <div class="dropdown">
          <a
            href="#"
            class="d-flex align-items-center text-white text-decoration-none dropdown-toggle"
            id="dropdownUser1"
            data-bs-toggle="dropdown"
            aria-expanded="false"
          >
            {% if user.profile_picture %}
            <img
              src="{{ user.profile_picture.url }}"
              width="32"
              height="32"
              class="rounded-circle me-2"
            />
            {% else %}
            <img
              src="{% static 'images/default_profile.png' %}"
              width="32"
              height="32"
              class="rounded-circle me-2"
            />
            {% endif %}
            <strong>{{ user.username }}</strong>
          </a>
          <ul
            class="dropdown-menu dropdown-menu-dark text-small shadow"
            aria-labelledby="dropdownUser1"
          >
            <li>
              <a class="dropdown-item" href="{% url 'dashboard' %}"
                >Dashboard</a
              >
            </li>
            {% if user.user_type == 2 %}
            <li>
              <a class="dropdown-item" href="{% url 'content:video_upload' %}"
                >Upload Video</a
              >
            </li>
            {% endif %}
            <li><hr class="dropdown-divider" /></li>
            <li>
              <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit" class="dropdown-item">Sign out</button>
              </form>
            </li>
          </ul>
        </div>
        {% else %}
        <a href="{% url 'login' %}" class="btn btn-outline-light me-2">Login</a>
        <a href="{% url 'register' %}" class="btn btn-primary">Register</a>
        {% endif %}
      </div>
    </div>
  </div>
</div>
