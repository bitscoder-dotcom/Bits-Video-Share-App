version: "3.8"

services:
  db:
    image: postgres:15
    container_name: videoshare_db
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: videosharing
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    networks:
      - videoshare-network

  web:
    build: .
    container_name: videoshare_web
    image: application:app
    working_dir: /app
    command:
      - gunicorn
      - --chdir
      - /app
      - videoshare.wsgi:application
      - --bind
      - 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
    networks:
      - videoshare-network

volumes:
  db_data:

networks:
  videoshare-network:
    driver: bridge
